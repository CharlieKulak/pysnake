[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pysnake"
version = "3.0.0"
description = "PySnake: a snake game with 17 combinable game modes, and a client for OpenSnake servers"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "pygame-ce>=2.4",
    "websockets>=13",
    # The game rules (shared with the server, which replays speedruns with them).
    "opensnake @ git+https://github.com/CharlieKulak/opensnake.git",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Arcade",
    "Operating System :: OS Independent",
]

[project.scripts]
pysnake = "pysnake.app:main"

[tool.setuptools.packages.find]
include = ["pysnake*"]

[tool.setuptools.package-data]
pysnake = ["sounds/*.ogg", "sounds/*.wav", "images/*.svg", "images/*.txt", "records.json",
           "packs/*/*.svg", "packs/*/*.wav", "packs/*/*.ogg", "packs/*/*.png", "packs/*/*.json"]
